name: Monitor music charts

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-music-charts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect charts and rebuild catalog
        run: |
          npm run monitor:charts
          npm run build:song-database
          npm run build:quiz-candidates
          npm run test:charts
      - name: Commit new observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/chart-observations.json \
            data/chart-catalog.json \
            data/chart-catalog.json.gz \
            data/chart-merge-review.json \
            data/song-database.json \
            data/song-database.json.gz \
            data/song-database.json.gz.part-01 \
            data/song-database.json.gz.part-02 \
            data/song-database-review.json \
            data/quiz-candidates.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update chart observations"
          git push
