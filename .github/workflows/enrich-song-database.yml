name: Enrich song database

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enrich-song-database.yml"
      - "scripts/enrich-song-database.mjs"
      - "scripts/enrichment-core.mjs"
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum songs in this batch"
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enrich priority songs
        env:
          ENRICH_LIMIT: ${{ github.event.inputs.limit || '500' }}
        run: npm run enrich:songs
      - name: Rebuild and verify the catalog
        run: |
          npm run build:song-database
          npm run build:quiz-candidates
          npm run test:charts
      - name: Save enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/song-enrichment-auto.json \
            data/song-database.json \
            data/song-database.json.gz \
            data/song-database.json.gz.part-01 \
            data/song-database.json.gz.part-02 \
            data/song-database-review.json \
            data/quiz-candidates.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enrich priority song metadata"
          git pull --rebase origin main
          git push origin HEAD:main
